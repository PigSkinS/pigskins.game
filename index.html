<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>俄羅斯方塊</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:#0f172a;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .container{
      display:flex;
      gap:24px;
      align-items:flex-start;
      flex-wrap:wrap;
      padding:20px;
    }

    canvas{
      background:#111827;
      border:4px solid #334155;
      border-radius:12px;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    .panel{
      width:220px;
      background:#1e293b;
      padding:20px;
      border-radius:16px;
    }

    .panel h1{
      margin-bottom:20px;
      font-size:28px;
    }

    .info{
      margin-bottom:20px;
    }

    .label{
      color:#94a3b8;
      font-size:14px;
      margin-bottom:6px;
    }

    .value{
      font-size:28px;
      font-weight:bold;
    }

    .controls{
      margin-top:20px;
      line-height:1.8;
      color:#cbd5e1;
      font-size:14px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
      margin-top:12px;
      transition:0.2s;
    }

    button:hover{
      background:#2563eb;
    }

    .game-over{
      margin-top:20px;
      color:#f87171;
      font-size:22px;
      font-weight:bold;
      display:none;
    }

  </style>
</head>

<body>

<div class="container">

  <canvas id="game" width="300" height="600"></canvas>

  <div class="panel">

    <h1>俄羅斯方塊</h1>

    <div class="info">
      <div class="label">分數</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="info">
      <div class="label">最高紀錄</div>
      <div class="value" id="highScore">0</div>
    </div>

    <div class="info">
      <div class="label">等級</div>
      <div class="value" id="level">1</div>
    </div>

    <button onclick="restartGame()">重新開始</button>

    <div class="game-over" id="gameOver">
      GAME OVER
    </div>

    <div class="controls">
      <div>← → 左右移動</div>
      <div>↓ 快速下降</div>
      <div>↑ 旋轉</div>
      <div>Space 直接落下</div>
    </div>

  </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 30;

canvas.width = COLS * BLOCK_SIZE;
canvas.height = ROWS * BLOCK_SIZE;

const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const highScoreEl = document.getElementById("highScore");
const gameOverEl = document.getElementById("gameOver");

const COLORS = [
  null,
  "#00f0f0",
  "#0000f0",
  "#f0a000",
  "#f0f000",
  "#00f000",
  "#a000f0",
  "#f00000"
];

const SHAPES = [
  [],

  [[1,1,1,1]],

  [[2,0,0],
   [2,2,2]],

  [[0,0,3],
   [3,3,3]],

  [[4,4],
   [4,4]],

  [[0,5,5],
   [5,5,0]],

  [[0,6,0],
   [6,6,6]],

  [[7,7,0],
   [0,7,7]]
];

let board;
let piece;
let score;
let level;
let dropInterval;
let lastTime;
let dropCounter;
let gameOver;

let highScore = localStorage.getItem("tetrisHighScore") || 0;

highScoreEl.textContent = highScore;

function createBoard() {

  return Array.from(
    { length: ROWS },
    () => Array(COLS).fill(0)
  );

}

function randomPiece() {

  const id = Math.floor(Math.random() * 7) + 1;

  const shape = SHAPES[id];

  return {
    x: Math.floor(COLS / 2) - Math.ceil(shape[0].length / 2),
    y: 0,
    shape,
    color: id
  };

}

function drawCell(x, y, color) {

  ctx.fillStyle = color;

  ctx.fillRect(
    x * BLOCK_SIZE,
    y * BLOCK_SIZE,
    BLOCK_SIZE,
    BLOCK_SIZE
  );

  ctx.strokeStyle = "#111";

  ctx.strokeRect(
    x * BLOCK_SIZE,
    y * BLOCK_SIZE,
    BLOCK_SIZE,
    BLOCK_SIZE
  );

}

function drawBoard() {

  ctx.fillStyle = "#111827";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  for(let y = 0; y < ROWS; y++){

    for(let x = 0; x < COLS; x++){

      if(board[y][x]){

        drawCell(
          x,
          y,
          COLORS[board[y][x]]
        );

      }

    }

  }

}

function drawPiece() {

  piece.shape.forEach((row, y) => {

    row.forEach((value, x) => {

      if(value){

        drawCell(
          piece.x + x,
          piece.y + y,
          COLORS[piece.color]
        );

      }

    });

  });

}

function collide() {

  for(let y = 0; y < piece.shape.length; y++){

    for(let x = 0; x < piece.shape[y].length; x++){

      if(
        piece.shape[y][x] &&
        (
          board[piece.y + y] === undefined ||
          board[piece.y + y][piece.x + x] === undefined ||
          board[piece.y + y][piece.x + x]
        )
      ){
        return true;
      }

    }

  }

  return false;

}

function merge() {

  piece.shape.forEach((row, y) => {

    row.forEach((value, x) => {

      if(value){

        board[piece.y + y][piece.x + x] = piece.color;

      }

    });

  });

}

function rotate(matrix) {

  return matrix[0].map((_, index) =>
    matrix.map(row => row[index]).reverse()
  );

}

function playerRotate() {

  const rotated = rotate(piece.shape);

  const oldShape = piece.shape;

  piece.shape = rotated;

  if(collide()){

    piece.shape = oldShape;

  }

}

function clearLines() {

  let lines = 0;

  outer:
  for(let y = ROWS - 1; y >= 0; y--){

    for(let x = 0; x < COLS; x++){

      if(board[y][x] === 0){

        continue outer;

      }

    }

    const row = board.splice(y, 1)[0].fill(0);

    board.unshift(row);

    lines++;

    y++;

  }

  if(lines > 0){

    score += lines * 100;

    level = Math.floor(score / 1000) + 1;

    dropInterval = Math.max(
      100,
      1000 - (level - 1) * 100
    );

    scoreEl.textContent = score;

    levelEl.textContent = level;

    if(score > highScore){

      highScore = score;

      localStorage.setItem(
        "tetrisHighScore",
        highScore
      );

      highScoreEl.textContent = highScore;

    }

  }

}

function pieceDrop() {

  piece.y++;

  if(collide()){

    piece.y--;

    merge();

    clearLines();

    piece = randomPiece();

    if(collide()){

      gameOver = true;

      gameOverEl.style.display = "block";

    }

  }

  dropCounter = 0;

}

function hardDrop() {

  while(!collide()){

    piece.y++;

  }

  piece.y--;

  merge();

  clearLines();

  piece = randomPiece();

  if(collide()){

    gameOver = true;

    gameOverEl.style.display = "block";

  }

}

function update(time = 0) {

  if(gameOver) return;

  const delta = time - lastTime;

  lastTime = time;

  dropCounter += delta;

  if(dropCounter > dropInterval){

    pieceDrop();

  }

  drawBoard();

  drawPiece();

  requestAnimationFrame(update);

}

document.addEventListener("keydown", e => {

  if(gameOver) return;

  if(e.key === "ArrowLeft"){

    piece.x--;

    if(collide()){

      piece.x++;

    }

  }

  else if(e.key === "ArrowRight"){

    piece.x++;

    if(collide()){

      piece.x--;

    }

  }

  else if(e.key === "ArrowDown"){

    pieceDrop();

  }

  else if(e.key === "ArrowUp"){

    playerRotate();

  }

  else if(e.code === "Space"){

    hardDrop();

  }

});

function restartGame() {

  board = createBoard();

  piece = randomPiece();

  score = 0;

  level = 1;

  dropInterval = 1000;

  lastTime = 0;

  dropCounter = 0;

  gameOver = false;

  gameOverEl.style.display = "none";

  scoreEl.textContent = 0;

  levelEl.textContent = 1;

  update();

}

restartGame();

</script>

</body>
</html>
